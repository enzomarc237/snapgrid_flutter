name: snapgrid_flutter
description: A modern screenshot management tool with AI-powered UI element detection
publish_to: none
version: 1.0.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  macos_ui: ^2.1.10
  path_provider: ^2.1.1
  file_picker: ^10.0.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.0.0
  macos_window_utils: ^1.7.1
  flutter_gemini: ^3.0.0
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.5.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
